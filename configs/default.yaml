# character-forge-v2 — default config (Mac-local, ComfyUI backend).
# Trimmed fork of character-forge's config: only comfy/gen/concept sections
# remain, since v2 only does hero-generation + reference-conditioned
# generation (no dataset/QC/curate/train/validate stages).

workspace: ./workspace
backend: comfy

comfy:
  url: http://127.0.0.1:8188
  # Path to your ComfyUI/models folder -- only needed for `forge2 download`.
  # Leave unset here and pass --comfy-dir instead (see scripts/download_models.py),
  # or set it to your own absolute path if you'd rather keep it in config.
  comfy_models_dir: null
  workflow_t2i: forge2/comfy_workflows/t2i_gguf.json
  workflow_edit: forge2/comfy_workflows/edit_gguf.json
  sampler: euler
  scheduler: simple
  shift: 3.1              # blurry/soft outputs? raise to 12-13
  timeout_s: 7200         # per-image ceiling; Mac + 20B + 40 steps is slow, ok
  poll_s: 2.0
  # model files are pre-configured in forge2/config.py (verified set:
  # Qwen-Image-2512 Q4_K_M, Qwen-Image-Edit-2511 Q4_K_M, Qwen2.5-VL Q4 + mmproj,
  # qwen_image_vae). Override here only if you change quants.

gen:
  width: 1024
  height: 1024
  speed_profile: full     # full = production quality | lightning = fast drafts
  steps_full: 40
  cfg_full: 2.5
  steps_lightning: 8
  cfg_lightning: 1.0
  # Ignored when cfg is 1.0 (lightning): ComfyUI skips the negative branch
  # at cfg 1. Only `full` (cfg 2.5) uses it -- keep must-hold constraints in
  # the positive instruction (forge2/prompts/templates.py).
  negative_prompt: >-
    photorealistic, 3d render, blurry, deformed anatomy, extra limbs,
    text, words, letters, writing, typography, captions, labels, signage,
    readable text, illegible text, garbled text, watermark, logos on
    clothing, brand logos, apple logo, logo on laptop, trademarks,
    inconsistent colors, two people, multiple characters, duplicate
    character, twins, crowd

concept:
  num_candidates: 12
  base_seed: 1000
